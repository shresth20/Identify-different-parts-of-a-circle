<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n="uiTitle">Identify Different Parts of a Circle</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/arcs.css" />
  <link rel="stylesheet" href="css/segments.css" />
  <link rel="stylesheet" href="css/sectors.css" />
  <link rel="stylesheet" href="css/quiz.css" />
  <link rel="stylesheet" href="css/arclen.css" />
  <link rel="stylesheet" href="css/circum.css" />
  <link rel="stylesheet" href="css/central.css" />
  <!-- The worked lines skill 4's worked pages are set in (see its head). -->
  <link rel="stylesheet" href="css/segarea.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <!-- Skill 3 last, as it was loaded on its own page: every rule in it is
       scoped to body.sa-lesson, on only while skill 3 plays. -->
  <link rel="stylesheet" href="css/sector-area.css" />
  <!-- Skill 2's formula and practice pages are built with skill 3's kit, in
       its stage, and this sheet adds only what an arc-length page needs
       of its own. After sector-area.css, so its few rules win. -->
  <link rel="stylesheet" href="css/arc-formula.css" />
</head>
<body>
  <!-- One screen at a time lives inside #app. The background art is painted on
       body, so a screen swap never re-decodes it. -->
  <main id="app">

    <!-- The 16:9 box the whole lesson is staged in. The board, the mascot and
         the Next control are all positioned against THIS, not against the
         board, so Next sits in the board's bottom-right corner from beat 1 --
         before the board itself has arrived, and without moving when it does. -->
    <div class="frame" id="frame">

      <!-- The mascot's centre-stage slot. It sits BEHIND the board on purpose:
           when the board arrives it covers the mascot, and the mascot's next
           entrance rises back out of the board's own surface. -->
      <div class="slot slot--hero" id="slotHero">
        <div class="bubble" id="bubble" hidden>
          <span class="type-wrap" id="bubbleType">
            <span class="type-ghost"></span>
            <span class="type" aria-live="polite"><span class="txt"></span></span>
          </span>
          <!-- The tail. Two paths, in this order for a reason: the filled
               one goes down first so it covers the box's border where the
               tail joins it, and the stroke then draws the tail's two FREE
               edges only -- which is how the tail and the box read as one
               outline rather than as a box with a triangle under it. -->
          <svg class="bubble-tail" viewBox="0 0 44 42" aria-hidden="true">
            <path d="M4 0 H42 V8 C36 20 24 30 2 42 C8 32 8 20 4 8 Z"
                  fill="var(--bubble-bg)" />
            <path d="M42 8 C36 20 24 30 2 42 C8 32 8 20 4 8" fill="none"
                  stroke="var(--note-edge)" stroke-width="4"
                  stroke-linecap="round" stroke-linejoin="round"
                  vector-effect="non-scaling-stroke" />
          </svg>
        </div>
      </div>

      <!-- The bird's stand-in for the half of every jump that happens BEHIND
           the board. Fixed to the screen and pegged to the hero rung of the
           --z ladder -- under the board -- so the spot it waits on, just
           below the board's top edge, is genuinely out of sight. pages.js
           sizes and places it from the bird's own box; see mascotJumpIn()
           there for why one element cannot do this on its own. -->
      <div class="hopper" id="hopper" aria-hidden="true"></div>

      <section class="board" id="board" aria-hidden="true">
        <!-- Three bands, three stacking levels (see --z-* in style.css): the
             header is above the footer, and both are above the stage, so the
             mascot standing on the header overlaps the figure behind it. -->
        <header class="board__top" id="boardTop">
          <div class="prompt" id="prompt">
            <div class="prompt__mascot" id="slotHeader"></div>
            <p class="prompt__line">
              <span class="type-wrap" id="promptType">
                <span class="type-ghost"></span>
                <span class="type" aria-live="polite"><span class="txt"></span></span>
              </span>
            </p>
          </div>
        </header>

        <div class="board__stage" id="boardStage">
          <!-- The whole section is drawn in ONE picture. The view box is wide
               rather than square -- 1000 x 420 with the circle in the middle
               -- because the last activity hangs five name boxes off the
               circle, and they need the room either side of it. The stage is
               wider still (about 2.5:1 at every board size), so the picture is
               always letterboxed by its HEIGHT and the circle comes out the
               same size a square picture would have given it. -->
          <svg class="figure" id="figure" viewBox="0 0 1000 420"
               role="img" data-i18n-attr="aria-label:a11yFigure" aria-label="A circle">
            <defs>
              <!-- The bloom under a part while it is being named. A blurred
                   copy of the mark itself, laid twice under the mark, so the
                   glow is always in the part's OWN ink -- nothing here names
                   a colour, which is what lets one filter serve the rim, the
                   lines and the dots alike.
                     Measured in the picture's own units, over the whole view
                   box: the radius, the diameter and the level chord are
                   horizontal, so their boxes have no height, and a region
                   measured against one would collapse to nothing and take
                   the line with it. -->
              <filter id="partGlow" filterUnits="userSpaceOnUse"
                      x="0" y="0" width="1000" height="420">
                <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="bloom" />
                <feMerge>
                  <feMergeNode in="bloom" />
                  <feMergeNode in="bloom" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>

              <!-- The soft light on the circumference while it is being
                   named, and the halo of the light that runs round it. Both
                   are the rim's own circle, so the region can be measured
                   against a real box, as #arcGlowBlur's is. -->
              <filter id="rimGlowBlur" x="-12%" y="-12%" width="124%" height="124%">
                <feGaussianBlur stdDeviation="5" />
              </filter>
            </defs>

            <!-- The colour inside the circle, poured in once the rim is
                 drawn. First in document order so the rim always draws on
                 top of it. -->
            <circle class="figure__disc" id="disc" cx="500" cy="210" r="158" />

            <!-- The rim held lit while it is named: a wide stroke of its own
                 ink, blurred away, under the line. The group is what fades in
                 and out; the circle inside it breathes for as long as the
                 light is on (see .rim-light in animations.css). -->
            <g class="rim-light" id="rimLight" aria-hidden="true">
              <circle class="rim-light__glow" cx="500" cy="210" r="158" />
            </g>

            <!-- The rim is a path, not a <circle>, for one reason: a stroke
                 unrolls from wherever its path starts, and a circle's starts
                 at three o'clock. This one starts at twelve and runs
                 clockwise -- the way a hand draws one -- as two semicircular
                 arcs, so no rotation is needed to get it there. -->
            <path class="figure__rim" id="rim"
                  d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />

            <!-- The light that runs once round the rim as the bird says what
                 a circumference is: the rim's own path again, five times,
                 each shown as ONE dash that rides round it (see rimRun in
                 animations.js). Every dash ends at the same point -- the head
                 of the light -- and `data-tail` is how far back along the rim
                 that layer reaches, so the longer layers, fainter and
                 thinner, are the trail it leaves. The blurred halo is first,
                 so the bright core is drawn over it. -->
            <g class="rim-run" id="rimRun" aria-hidden="true">
              <path class="rim-run__halo" data-tail="70"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <path class="rim-run__trail rim-run__trail--far" data-tail="210"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <path class="rim-run__trail rim-run__trail--mid" data-tail="120"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <path class="rim-run__trail" data-tail="50"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <path class="rim-run__head" data-tail="1"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
            </g>
            <!-- The pen. A dot that pops in at twelve o'clock and rides the
                 tip of the stroke all the way round, so the circle is seen
                 to be drawn FROM a point rather than to appear along a line.
                 animations.js moves it from the rim's own geometry. -->
            <circle class="rim-tip" id="rimTip" cx="500" cy="52" r="7" />

            <!-- The radius, and the diameter it becomes. The line is TWO
                 halves that both start at the centre: the right one is drawn
                 first and taught as the radius; the left one is not drawn at
                 all but COPIED -- a faint copy of the radius is lifted off it,
                 carried across the centre and set down on the other side, and
                 the left half comes up solid underneath it. The learner sees
                 the very same length moved over, not a second line grown to
                 match. Because they are two paths, each half can then be lit
                 and named on its own before the pair is recoloured as one
                 line. -->
            <g class="figure__dia" id="dia" hidden>
              <!-- The radius swept once round the centre as the bird says
                   what a radius is, and the faint radii it leaves at the
                   points it passes. Built by pages.js (see buildSweep);
                   under the halves, so the named radius hides the arm where
                   the two lie on each other. -->
              <g class="rad-sweep" id="radSweep" aria-hidden="true"></g>
              <path class="dia__half" id="halfRight" d="M500 210 L658 210" />
              <path class="dia__half" id="halfLeft"  d="M500 210 L342 210" />
              <!-- The copy: the right half's own path once more, faint, and
                   moved by exactly one radius to the left (see copyRadius in
                   animations.js). It is above the halves in document order so
                   it is seen to be lifted OFF the radius rather than out from
                   under it. -->
              <path class="dia__ghost" id="halfGhost" d="M500 210 L658 210" />
              <!-- The two radii joined: the whole diameter in its own
                   colour, run from end to end over the halves (see
                   joinDiameter in animations.js). -->
              <path class="dia__join" id="diaJoin" d="M342 210 L658 210" />
              <circle class="end-dot" id="endRight" cx="658" cy="210" r="4.4" />
              <circle class="end-dot" id="endLeft"  cx="342" cy="210" r="4.4" />
              <text class="figure-label dia__r" id="rLabelRight"
                    x="579" y="246" text-anchor="middle" data-i18n="lblRadius">Radius</text>
              <text class="figure-label dia__r" id="rLabelLeft"
                    x="421" y="246" text-anchor="middle" data-i18n="lblRadius">Radius</text>
              <!-- The diameter's name, written under the line it names
                   once the voice has said it (sceneParts, page 4). -->
              <text class="figure-label dia__name" id="diaName"
                    x="500" y="246" text-anchor="middle"
                    data-i18n="s1LblDiameter">Diameter</text>
              <!-- The rule the merge has just shown, set under the circle
                   once the halves are one line. Each name in the colour of
                   the line it names -- the diameter's blue, the radius's
                   orange -- so the sentence points back at the picture. -->
              <rect class="dia__plate" id="diaPlate" x="0" y="0" width="0" height="0" />
              <text class="figure-label dia__rule" id="diaRule"
                    x="500" y="411" text-anchor="middle"><tspan class="rule__dia" data-i18n="s1LblDiameter">Diameter</tspan><tspan class="rule__eq"> = 2 × </tspan><tspan class="rule__rad" data-i18n="lblRadius">Radius</tspan></text>
            </g>

            <!-- The chords: the one that is taught and the three that follow
                 it. Built by pages.js from the circle's own geometry. -->
            <g class="figure__chords" id="chords" hidden></g>

            <!-- The activity: the parts laid on the circle, the five boxes
                 round it and the dashed leaders that tie each box to its
                 part. Built by pages.js -- see buildQuiz there. Before the
                 centre in document order so the centre dot paints over the
                 lines that meet at it. -->
            <g class="figure__quiz" id="quiz" hidden></g>

            <g class="figure__centre" id="centre" hidden>
              <circle class="centre__glow" cx="500" cy="210" r="22" />
              <circle class="centre__dot"  cx="500" cy="210" r="5" />
              <!-- A finger-sized hit area over a 10px dot. -->
              <circle class="centre__hit"  id="centreHit" cx="500" cy="210" r="34"
                      role="button" tabindex="0"
                      data-i18n-attr="aria-label:a11yCentreHit"
                      aria-label="Tap the dot at the centre of the circle" />
            </g>

            <!-- The one callout: an arrow and the word at its tail. Every
                 part is named with this same group -- pages.js aims it at
                 the part in hand and writes the word -- because only one
                 thing is ever being named at a time. The head is one
                 polyline, barb-tip-barb, so the join at the tip is the pen's
                 own. -->
            <g class="figure__mark" id="mark" hidden>
              <path class="mark__arrow" id="markArrow" d="" />
              <path class="mark__head"  id="markHead"  d="" />
              <text class="figure-label mark__label" id="markLabel" x="0" y="0"></text>
            </g>

            <!-- ---- Section 2: arcs (js/arcs.js) ----------------------------
                 Its own circle, not the one above. Everything this section
                 does to the circle -- slides it aside, turns the marks on
                 it, recolours its rim as two pieces -- is done to this group
                 as ONE thing, and section 1's beats hold the circle above by
                 name and must never find it moved. What depends on the two
                 points the learner picks is written by arcs.js; what is
                 fixed is here. After section 1's marks in the picture, so
                 it paints over whatever the section before left -- though
                 nothing of that is on the board by the time this is shown. -->
            <g class="figure__arcs" id="arcs" hidden>
              <defs id="arcDefs">
                <!-- The soft light behind the rim while a point is being
                     picked: a wide coral stroke blurred away (see .arc-glow
                     in arcs.css). A circle has a proper box, so the filter
                     region can be measured against it. -->
                <filter id="arcGlowBlur" x="-12%" y="-12%" width="124%" height="124%">
                  <feGaussianBlur stdDeviation="5" />
                </filter>
              </defs>
              <circle class="arc-glow" id="arcGlow" cx="500" cy="210" r="158" />
              <!-- No disc here, unlike the lesson's circle: this section is
                   about the circumference, and an open ring keeps the eye on
                   the line rather than on the shape it closes. -->
              <path class="figure__rim" id="arcRim"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <circle class="rim-tip" id="arcTip" cx="500" cy="52" r="7" />
              <!-- A finger-wide, invisible band over the rim: where a press
                   has to land to put a point on the circle, and what the
                   keyboard holds while it places one. -->
              <circle class="arc-band" id="arcBand" cx="500" cy="210" r="158"
                      tabindex="-1" role="button"
                      data-i18n-attr="aria-label:a11yBand"
                      aria-label="The edge of the circle. Tap it to place a point." />
              <!-- The diameter, dashed: the line the two points are moved
                   onto in the third scene. Shown through a mask that arcs.js
                   builds and dashedIn strokes, as the activity's leaders
                   are. -->
              <path class="arc-dia" id="arcDia" d="M342 210 L658 210" mask="url(#arcDiaMask)" />
              <!-- The two pieces. Both are written to start at the point
                   the learner placed LAST and run to the first, one each
                   way round, so that when the circumference is recoloured
                   each colour sets off from the point just put down -- the
                   smaller piece first, then the larger -- and both end at
                   the other. The minor one is on top: where the two share
                   an end, the smaller piece's round cap is the one seen. -->
              <path class="arc-piece arc-piece--major" id="arcMajor" d="" />
              <path class="arc-piece arc-piece--minor" id="arcMinor" d="" />
              <!-- The name boxes, and the callouts and labels -- built by
                   arcs.js. -->
              <g class="arc-boxes" id="arcBoxes" hidden></g>
              <g class="arc-marks" id="arcMarks" hidden></g>
              <g class="figure__centre is-quiet" id="arcCentre" hidden>
                <circle class="centre__dot" cx="500" cy="210" r="7" />
              </g>
              <!-- The ghost: the mark that rides the rim under the finger
                   before a point is placed. -->
              <circle class="arc-ghost" id="arcGhost" cx="500" cy="52" r="7" />
              <!-- The two points, each with a finger-sized hit area for the
                   scene in which they are dragged. Placed by cx/cy, never by
                   a transform, so a pop on one can never fight the drag. -->
              <g class="arc-point" id="arcPointA">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPointDrag"
                        aria-label="A point on the circle. Drag it along the edge." />
              </g>
              <g class="arc-point" id="arcPointB">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPointDrag"
                        aria-label="A point on the circle. Drag it along the edge." />
              </g>
              <!-- The hands: two pointing hands drawn in line, faint, that
                   show the learner the gesture being asked for -- a tap on
                   the rim, or a point slid along it. Built by arcs.js; last,
                   so they are over the points they are about. -->
              <g class="arc-nudges" id="arcNudges" hidden aria-hidden="true"></g>
            </g>

            <!-- ---- Section 3: segments (js/segments.js) -----------------
                 Its own circle again, for the reason section 2 has one:
                 what this section does to the circle -- lights the inside
                 of it, cuts it with a chord, colours the two regions -- is
                 done to this group, and the sections before hold their
                 circles by name. What depends on the two points the
                 learner picks is written by segments.js; what is fixed is
                 here. The points, the ghost, the band and the hand are the
                 same marks section 2 puts on its rim, so they wear its
                 classes. -->
            <g class="figure__segs" id="segs" hidden>
              <defs id="segDefs">
                <filter id="segGlowBlur" x="-12%" y="-12%" width="124%" height="124%">
                  <feGaussianBlur stdDeviation="5" />
                </filter>
                <!-- The two regions are coloured in from the chord outward:
                     each is shown through a circle centred on the chord's
                     middle, which segments.js places and segFill (in
                     animations.js) grows from nothing. At rest both stand
                     wide open, so a region shown without the beat is
                     whole. -->
                <clipPath id="segClipMinor">
                  <circle id="segClipMinorC" cx="500" cy="210" r="400" />
                </clipPath>
                <clipPath id="segClipMajor">
                  <circle id="segClipMajorC" cx="500" cy="210" r="400" />
                </clipPath>
              </defs>
              <circle class="seg-glow" id="segGlow" cx="500" cy="210" r="158" />
              <circle class="figure__disc" id="segDisc" cx="500" cy="210" r="158" />
              <!-- The area: the space inside the circle, lit as one thing
                   while it is being named. It goes as the regions arrive. -->
              <circle class="seg-area" id="segArea" cx="500" cy="210" r="158" />
              <!-- The two regions the chord makes. The larger is under the
                   smaller in document order, as the two arcs are: where
                   the two meet along the chord, the smaller piece's edge
                   is the one seen. Written by segments.js. -->
              <path class="seg-region seg-region--major" id="segMajor" d=""
                    clip-path="url(#segClipMajor)" />
              <path class="seg-region seg-region--minor" id="segMinor" d=""
                    clip-path="url(#segClipMinor)" />
              <!-- The chord: the line section 1 taught, in its colour,
                   written to run from the point the learner placed LAST. -->
              <path class="chord-line" id="segChord" d="" />
              <!-- The rim is over the regions so it covers the seam where
                   each region's edge meets the circle. -->
              <path class="figure__rim" id="segRim"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <circle class="rim-tip" id="segTip" cx="500" cy="52" r="7" />
              <circle class="arc-band" id="segBand" cx="500" cy="210" r="158"
                      tabindex="-1" role="button"
                      data-i18n-attr="aria-label:a11yBand"
                      aria-label="The edge of the circle. Tap it to place a point." />
              <g class="arc-boxes" id="segBoxes" hidden></g>
              <g class="arc-marks" id="segMarks" hidden></g>
              <!-- Over the regions, so the dot paints on top of the colour. -->
              <g class="figure__centre is-quiet" id="segCentre" hidden>
                <circle class="centre__dot" cx="500" cy="210" r="7" />
              </g>
              <circle class="arc-ghost" id="segGhost" cx="500" cy="52" r="7" />
              <g class="arc-point" id="segPointA">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPoint"
                        aria-label="A point on the circle." />
              </g>
              <g class="arc-point" id="segPointB">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPoint"
                        aria-label="A point on the circle." />
              </g>
              <g class="arc-nudges" id="segNudges" hidden aria-hidden="true"></g>
            </g>

            <!-- ---- Section 4: sectors (js/sectors.js) -------------------
                 Its own circle once more, for the reason the two sections
                 before have one. This one is cut by two RADII rather than
                 a chord, so the two regions are wedges that meet at the
                 centre; what depends on the two points the learner picks
                 is written by sectors.js, and what is fixed is here. The
                 points, the ghost, the band and the hand are section 2's
                 marks on another circle, so they wear its classes. -->
            <g class="figure__secs" id="secs" hidden>
              <defs id="secDefs">
                <filter id="secGlowBlur" x="-12%" y="-12%" width="124%" height="124%">
                  <feGaussianBlur stdDeviation="5" />
                </filter>
              </defs>
              <circle class="sec-glow" id="secGlow" cx="500" cy="210" r="158" />
              <circle class="figure__disc" id="secDisc" cx="500" cy="210" r="158" />
              <!-- The two wedges the radii make. The larger is under the
                   smaller in document order, as the segments are. Written
                   by sectors.js, and swept out from one radius to the
                   other by secSweep in animations.js. Each is a control
                   for the one beat in which it is asked for; the label
                   names neither, or it would answer the question. -->
              <path class="sec-region sec-region--major" id="secMajor" d=""
                    tabindex="-1" role="button" data-i18n-attr="aria-label:a11yRegion" aria-label="A region of the circle." />
              <path class="sec-region sec-region--minor" id="secMinor" d=""
                    tabindex="-1" role="button" data-i18n-attr="aria-label:a11yRegion" aria-label="A region of the circle." />
              <!-- The two radii: the line section 1 taught, in its colour,
                   each from the centre out to one of the points. -->
              <path class="sec-radius" id="secRadiusA" d="" />
              <path class="sec-radius" id="secRadiusB" d="" />
              <!-- The rim is over the regions so it covers the seam where
                   each region's edge meets the circle. -->
              <path class="figure__rim" id="secRim"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <circle class="rim-tip" id="secTip" cx="500" cy="52" r="7" />
              <circle class="arc-band" id="secBand" cx="500" cy="210" r="158"
                      tabindex="-1" role="button"
                      data-i18n-attr="aria-label:a11yBand"
                      aria-label="The edge of the circle. Tap it to place a point." />
              <g class="arc-boxes" id="secBoxes" hidden></g>
              <g class="arc-marks" id="secMarks" hidden></g>
              <!-- Over the regions and the radii, so the dot paints on top
                   of the point where the two lines meet. -->
              <g class="figure__centre is-quiet" id="secCentre" hidden>
                <circle class="centre__dot" cx="500" cy="210" r="7" />
              </g>
              <circle class="arc-ghost" id="secGhost" cx="500" cy="52" r="7" />
              <g class="arc-point" id="secPointA">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPoint"
                        aria-label="A point on the circle." />
              </g>
              <g class="arc-point" id="secPointB">
                <circle class="arc-dot" cx="500" cy="52" r="6.5" />
                <circle class="arc-dot__hit" cx="500" cy="52" r="30" tabindex="-1" role="button"
                        data-i18n-attr="aria-label:a11yPoint"
                        aria-label="A point on the circle." />
              </g>

              <circle class="sa-disc" id="sjDisc" cx="500" cy="210" r="158" />
              <path class="sa-region sa-region--major" id="sjMajor" d=""
                    clip-path="url(#sjClip)" />
              <g class="se-piece" id="sjPiece">
                <path class="se-tri" id="sjTri" d="" />
                <path class="sa-radius" id="sjTriA" d="" />
                <path class="sa-radius" id="sjTriB" d="" />
                <path class="sa-chord" id="sjTriC" d="" />
                <path class="s4-angle" id="sjAngle" d="" />
                <text class="figure-label s4-theta" id="sjTheta" x="0" y="0"
                      text-anchor="middle" data-i18n="lblTheta">θ</text>
              </g>
              <path class="sa-rim" id="sjRim"
                    d="M500 52 A158 158 0 0 1 500 368 A158 158 0 0 1 500 52" />
              <circle class="rim-tip" id="sjTip" cx="500" cy="52" r="7" />
              <path class="sa-arc sa-arc--major" id="sjArcMajor" d="" />
              <path class="sa-radius" id="sjRadA" d="" />
              <path class="sa-radius" id="sjRadB" d="" />
              <path class="sa-chord" id="sjChord" d="" />
              <circle class="sa-centre" id="sjCentre" cx="500" cy="210" r="6" />
              <circle class="arc-dot" id="sjDotA" cx="500" cy="52" r="7" />
              <circle class="arc-dot" id="sjDotB" cx="500" cy="52" r="7" />
              <text class="figure-label sc-label sc-label--major" id="sjLbl" x="0" y="0"
                    text-anchor="middle" data-i18n="s4p4Major">Major segment</text>
            </g>

            <!-- ---- Skill 4, page 12: the major recap (js/segarea.js).
                 Three small circles in a row -- the major sector, the
                 triangle, the major segment -- built by segarea.js into the
                 group, with "+" and "=" between them and a name under
                 each. Nothing here is a target. -->
            <g class="figure__sk" id="sk" hidden>
              <g class="sf-figs" id="skFigs"></g>
              <text class="figure-label sf-sign" id="skPlus" x="335" y="202"
                    text-anchor="middle" data-i18n="symPlus">+</text>
              <text class="figure-label sf-sign" id="skEquals" x="665" y="202"
                    text-anchor="middle" data-i18n="symEq">=</text>
              <text class="figure-label sf-label sf-label--msector" id="skLblSector" x="170" y="348"
                    text-anchor="middle" data-i18n="s4p12MajorSector">Major sector</text>
              <text class="figure-label sf-label sf-label--triangle" id="skLblTriangle" x="500" y="348"
                    text-anchor="middle" data-i18n="s4p1Triangle">Triangle</text>
              <text class="figure-label sf-label sf-label--msegment" id="skLblSegment" x="830" y="348"
                    text-anchor="middle" data-i18n="s4p4Major">Major segment</text>
            </g>
          </svg>

          <!-- The right half of the board, for the beats where the circle
               stands aside and the bird speaks beside it -- what a
               circumference, a radius and a diameter are, in section 1,
               and the arcs, in section 2. Its own
               bubble, because the hero one is parked on the field outside
               the board. Sized as a container so the bird and its bubble are
               measured against THIS half and not the viewport -- see .aside
               in css/arcs.css. -->
          <div class="aside" id="aside" hidden>
            <div class="slot slot--aside" id="slotAside">
              <div class="bubble bubble--aside" id="bubbleAside" hidden>
                <span class="type-wrap" id="asideType">
                  <span class="type-ghost"></span>
                  <span class="type" aria-live="polite"><span class="txt"></span></span>
                </span>
                <!-- A second line under the first, for a note that is added
                   to rather than replaced (the diameter's). Out of the
                   layout until a line is reserved in it. -->
                <span class="type-wrap type-wrap--more" id="asideMore" hidden>
                  <span class="type-ghost"></span>
                  <span class="type" aria-live="polite"><span class="txt"></span></span>
                </span>
                <svg class="bubble-tail" viewBox="0 0 44 42" aria-hidden="true">
                  <path d="M4 0 H42 V8 C36 20 24 30 2 42 C8 32 8 20 4 8 Z"
                        fill="var(--bubble-bg)" />
                  <path d="M42 8 C36 20 24 30 2 42 C8 32 8 20 4 8" fill="none"
                        stroke="var(--note-edge)" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round"
                        vector-effect="non-scaling-stroke" />
                </svg>
              </div>
            </div>
          </div>

          <!-- The fill-the-blank card (js/arclen.js): the right half of the
               stage while skill 2's circle stands left, one sentence with an
               empty slot in it and the names in a row beneath. The name is
               dragged into the slot, so the slot and the names are the only
               live things in the pane -- and only while a round is open
               (see .is-live in arclen.css). -->
          <!-- The words either side of the slot are in spans of their own,
               not bare text, on purpose: GSAP measures the slot while the
               pane is display:none by re-parenting it and putting it back
               before its next ELEMENT sibling -- a slot followed by bare
               text would be put back at the end of the sentence. -->
          <div class="ask-pane" id="alAsk" hidden>
            <p class="ask-line" id="alLine"><span data-i18n="askThisIsThe">This is the</span>
              <span class="ask-slot" id="alSlot" role="button" tabindex="-1"
                    data-i18n-attr="aria-label:a11yDropSlot"
                    aria-label="Empty slot. Drop a name here."><span
                    class="ask-slot__text" id="alSlotText"></span></span>
              <span data-i18n="askOfTheCircle">of the circle.</span></p>
            <!-- The names, under the sentence they answer: the tray's own
                 pills (see .chip in style.css), built here by arclen.js. -->
            <div class="ask-opts" id="alOpts" data-i18n-attr="aria-label:a11yNamesTray" aria-label="Names to drag"></div>
          </div>

          <!-- Skill 2, section 2 (js/circum.js): the right half of the stage
               while the circle stands left. The bird lands in the pane and
               asks from the box above its head -- bubble-02, drawn as the
               definition card is (rim, face, shadows, tail), recoloured green
               for a right answer and red for a wrong one. It is its OWN
               element: bubble-01 -- the definition card on #bubbleAside -- is
               another section's and is not touched. The three answers stand
               in a row beneath. -->
          <div class="cf-pane" id="cfPane" hidden>
            <div class="slot slot--cf" id="slotCf">
              <div class="bubble bubble--cf" id="bubbleCf" hidden>
                <span class="type-wrap" id="cfType">
                  <span class="type-ghost"></span>
                  <span class="type" aria-live="polite"><span class="txt"></span></span>
                </span>
                <!-- The tail: the hero bubble's drawing, stamped again, so the
                     box reads as the same object wherever the bird speaks. -->
                <svg class="bubble-tail" viewBox="0 0 44 42" aria-hidden="true">
                  <path d="M4 0 H42 V8 C36 20 24 30 2 42 C8 32 8 20 4 8 Z"
                        fill="var(--bubble-bg)" />
                  <path d="M42 8 C36 20 24 30 2 42 C8 32 8 20 4 8" fill="none"
                        stroke="var(--note-edge)" stroke-width="4"
                        stroke-linecap="round" stroke-linejoin="round"
                        vector-effect="non-scaling-stroke" />
                </svg>
              </div>
            </div>
            <div class="cf-opts" id="cfOpts" role="group"
                 data-i18n-attr="aria-label:a11yFormulas"
                 aria-label="Choose the correct formula"></div>
          </div>

          <!-- Skill 2, section 3 (js/central.js): the legend of the
               naming page. The right half of the stage, as #cfPane is:
               the three names arrive one by one under the bird, where the
               answers usually stand, each in the colour of the mark it
               names, and move to the middle of the half once the bird has
               gone. Glass throughout -- nothing here is a control. -->
          <div class="cl-pane" id="clPane" hidden>
            <ul class="cl-legend" id="clLegend">
              <li class="cl-item cl-item--s" id="clS" data-i18n="p25LegendS">s = Arc Length</li>
              <li class="cl-item cl-item--r" id="clR" data-i18n="p25LegendR">r = Radius</li>
              <li class="cl-item cl-item--th" id="clTh" data-i18n="p25LegendTheta">θ = Central Angle</li>
            </ul>
          </div>

          <!-- Skill 3 (js/sector-area.js): every scene builds its own
               picture and panel in here, and the scene after it clears it
               away. Last in the stage, so it is over the (empty) figure;
               shown only while body.sa-lesson is on (sector-area.css). -->
          <div class="sa-stage" id="saStage"></div>
        </div>

        <!-- The footer holds the five names the learner drags onto the
             boxes, and nothing else, and only in the last activity. -->
        <!-- The footer holds whatever the learner has to reach for: the five
             names they drag onto the boxes in the last activity, and the two
             answers to the yes/no question before it. Never both at once, so
             they share the band. -->
        <footer class="board__bottom" id="boardBottom">
          <div class="tray" id="tray" hidden data-i18n-attr="aria-label:a11yNamesTray" aria-label="Names to drag"></div>
          <div class="tray tray--choice" id="choices" hidden
               role="group" data-i18n-attr="aria-label:a11yAnswers" aria-label="Choose your answer"></div>
        </footer>
      </section>

      <!-- Not drawn, not focusable, and not a control. It exists so a beat
           that is finished by SEVERAL actions -- five names dropped into five
           boxes -- has one element to announce itself on: Flow.once is the
           lesson's one way to wait for a person and it waits on an element,
           so routing the activity through one means the wait is cancelled
           with the rest of the chain when a scene is retired. -->
      <span id="gate" hidden></span>

      <!-- Skill 3 (js/sector-area.js): where a burst of confetti is thrown,
           over everything in the frame. -->
      <svg class="sa-burst" id="saBurst" aria-hidden="true"></svg>

      <!-- The round Next disc, as drawn in the spacecraft game: a rim set a
           little low so it reads as the thickness of a disc, a face lit from
           the top, and an arrow grown back by a round stroke so every corner
           of it is rounded evenly. Its colours are the --next-* tokens in
           style.css, so it is re-skinned with the rest of the palette. -->
      <button class="next-btn" id="nextBtn" type="button" hidden data-i18n-attr="aria-label:a11yNext" aria-label="Next">
        <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="icoNextFace" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="var(--next-face-1)" />
              <stop offset=".55" stop-color="var(--next-face-2)" />
              <stop offset="1" stop-color="var(--next-face-3)" />
            </linearGradient>
          </defs>
          <circle cx="50" cy="51.5" r="45" fill="var(--next-rim)" />
          <circle cx="50" cy="50" r="41.5" fill="url(#icoNextFace)" />
          <path d="M31.25 43.125 H52.5 V31.25 L77.5 50 L52.5 68.75 V56.875 H31.25 Z"
                fill="var(--next-arrow)" stroke="var(--next-arrow)" stroke-width="8.75"
                stroke-linejoin="round" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <!-- Welcome, over everything until Start is pressed. The title and the
         bird are painted into the artwork (welcome-page.png), so the heading
         is there for screen readers only. -->
    <section class="welcome" id="welcome">
      <h1 class="welcome__title" data-i18n="uiTitle">Identify Different Parts of a Circle</h1>
      <button class="start-btn" id="startBtn" type="button" hidden data-i18n="btnStart">Start</button>
    </section>
  </main>

  <script src="locales/locales.js"></script>

  <script src="js/flow.js"></script>

  <script src="js/mathtext.js"></script>
  <script src="js/typer.js"></script>

       this line and js/arclen.js (with css/arclen.css) are the whole of it. -->
  <script src="js/arclen.js"></script>
  <!-- Skill 2, section 2: the circumference formula. Same board, same bird;
       its question is asked from bubble-02 in the right pane (#cfPane). To
       split it out later, this line, js/circum.js, css/circum.css and the
       two blocks in index.html (#cf and #cfPane) are the whole of it. -->
  <script src="js/circum.js"></script>
  <!-- Skill 2, section 3: the central angle. Same board, same bird; its
       two points are section 2's interaction, and its questions are asked
       from section 2 of the skill's bubble-02. To split it out later, this
       line, js/central.js, css/central.css, the one group in the figure
       (#ca) and #clPane are the whole of it. -->
  <script src="js/central.js"></script>
  <!-- Skill 2, section 4: the arc-length formula derived, then worked and
       asked, and the skill summed up -- built with skill 3's kit (which
       loads next and hands it over on window.SectorArea) in #saStage, in
       skill 3's own design. Loaded here because a section's scenes join
       the lesson in load order. To split it out later, this line,
       js/arc-formula.js and css/arc-formula.css are the whole of it. -->
  <script src="js/arc-formula.js"></script>
  <!-- Skill 3: area of a sector. Same board, same bird; its pictures are
       built in #saStage, and its confetti thrown in #saBurst. Loaded here,
       between skills 2 and 4, because a section's scenes join the lesson
       in load order. To split it out later, this line, js/sector-area.js,
       css/sector-area.css, #saStage and #saBurst are the whole of it. -->
  <script src="js/sector-area.js"></script>
  <!-- Skill 4: area of a segment of a circle. Same board, same bird; its
       teaching pages are drawn on the figure (the six groups #sa #sc #se
       #sf #sj #sk, with skill 2's two-point pick from arcs.js), and every
       page that asks a question is built in skill 3's stage with skill 3's
       kit (window.SectorArea), so it must load after js/sector-area.js. To
       split it out later, this line, js/segarea.js, css/segarea.css and
       those six groups are the whole of it. -->
  <script src="js/segarea.js"></script>
  <script src="js/script.js"></script>

  <script src="js/devnav.js"></script>
